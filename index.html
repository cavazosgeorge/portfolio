<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231947d1'/%3E%3Ctext x='50' y='61' text-anchor='middle' font-family='Arial,sans-serif' font-size='34' font-weight='700' fill='white'%3EGC%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="George Cavazos is a Senior Automation IT/OT Engineer building reliable systems where industrial automation, data, AI, and the web meet." />
    <meta name="theme-color" id="theme-color" content="#f6f4ee" />
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>George Cavazos | Senior Automation IT/OT Engineer</title>
  </head>
  <body>
    <!-- Blocking script to prevent flash of incorrect color scheme -->
    <script>
      (function() {
        var storedTheme = localStorage.getItem('color-mode');
        var theme = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        document.getElementById('theme-color').setAttribute('content', theme === 'dark' ? '#11130f' : '#f6f4ee');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
